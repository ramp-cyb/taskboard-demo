<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var saved = null;
      try {
        var value = localStorage.getItem('taskboard-theme');
        if (value === 'dark' || value === 'light') saved = value;
      } catch (e) {}
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <main>
    <header>
      <h1>TaskBoard</h1>
      <span id="remaining"></span>
      <button id="theme-toggle" aria-label="Toggle dark mode" type="button">🌙</button>
    </header>

    <form id="add-form">
      <input id="title" placeholder="What needs doing?" autocomplete="off">
      <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <input id="search" type="search" placeholder="Search tasks">

    <ul id="tasks"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
