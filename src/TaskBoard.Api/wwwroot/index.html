<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>TaskBoard</h1>
      <span id="remaining"></span>
    </header>

    <form id="add-form">
      <input id="title" placeholder="What needs doing?" autocomplete="off">
      <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <input id="search" type="search" placeholder="Search tasks">
    <a id="export-link" href="/api/tasks/export" download="tasks.csv">Export</a>

    <div id="filter-tabs" class="tabs">
      <button type="button" class="tab active" data-status="">All</button>
      <button type="button" class="tab" data-status="active">Active</button>
      <button type="button" class="tab" data-status="completed">Completed</button>
    </div>

    <ul id="tasks"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
